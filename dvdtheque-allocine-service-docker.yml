
spring:
  datasource:
    platform: postgres
    username: dvdtheque_user
    password: dvdtheque_pass
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
    url: jdbc:postgresql://localhost:5432/dvdthequedb?currentSchema=dvdtheque-allocine-service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: dvdtheque-allocine-service
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    default-schema: dvdtheque-allocine-service
    liquibase-schema: public
  security:
    oauth2:
      resourceserver:
        jwt:
          #jwk-set-uri: http://localhost:8080/auth/realms/dvdtheque-realm/protocol/openid-connect/certs
          issuer-uri: http://localhost:8080/realms/dvdtheque
          user-name-attribute: preferred_username
      client:
        provider:
          keycloak:
            token-uri: http://localhost:8080/realms/dvdtheque/protocol/openid-connect/token
        registration:
          keycloak:
            client-id: dvdtheque-api
            client-secret: O6psFNkYX0Qw5I3aCrJUOy9qSaHENV8i
            authorization-grant-type: client_credentials

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 180
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    healthcheck:
      enabled: true
    lease:
      duration: 5
  
fichefilm:
  parsing:
    page: 200
    cron: 0 50 00 * * ?
    
hazelcast:
  cluster-name: hazelcast-allocine-local
  networkconfig:
    tcpipconfig:
      members: 172.18.0.3
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    enabled: true